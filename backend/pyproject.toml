[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "dubeyachyutam.2004@gmail.com" }
]
requires-python = ">=3.12.10"
dependencies = [
    "alembic>=1.20.0",
    "arq>=0.28.0",
    "fastapi>=0.142.2",
    "fastembed>=0.9.0",
    "pgvector>=0.5.1",
    "psycopg2-binary>=2.9.13",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "pymupdf>=1.28.2",
    "python-frontmatter>=1.3.0",
    "python-multipart>=0.0.32",
    "redis>=5.3.1",
    "sentry-sdk>=2.71.0",
    "sqlalchemy>=2.1.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
